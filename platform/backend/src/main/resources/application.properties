spring.application.name=weekly-report-generator
local.server.port=8080

spring.config.import=optional:classpath:application-secrets.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=WARN

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.cookie-secure=${APP_JWT_COOKIE_SECURE}

springdoc.swagger-ui.path=/swagger-ui.html

# ---- auth hardening -------------------------------------------------------------

# Where invitation / password-reset links point (the deployed frontend's URL).
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

app.security.invite-ttl-hours=48
app.security.reset-ttl-minutes=30
# Failed sign-ins per address within the window before a temporary lockout.
app.security.max-failed-logins=5
app.security.attempt-window-minutes=15
app.security.lockout-minutes=15

# Behind a proxy (Render, etc.) the real client address comes from X-Forwarded-For;
# "native" lets Tomcat honour it only when the request came from a trusted proxy.
server.forward-headers-strategy=native

# false: emails (invites, password resets) are written to the log instead of sent.
# true : sent via SMTP using the standard spring.mail.* settings (see the backend README).
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@cadence.local}

# ---- seed / bootstrap ------------------------------------------------------------------

app.seed.demo-data=${APP_SEED_DEMO_DATA:true}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:Administrator}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# ---- email invitation ----------------------------------------------------------------------

app.mail.provider=${APP_MAIL_PROVIDER:smtp}
app.mail.gmail.client-id=${GMAIL_CLIENT_ID:}
app.mail.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
app.mail.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}